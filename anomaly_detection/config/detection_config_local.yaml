data_sources:
  cluster_usage: data/dashboard_cluster_usage.json
  login_jobs: data/dashboard_login_jobs.json
detection:
  check_interval: 300
  lookback_hours: 48
  min_data_points: 20
  sensitivity: 3
thresholds:
  job_rate:
    warning: 2.0
    critical: 3.0
  core_usage:
    warning: 2.5
    critical: 3.5
  execution_time:
    warning: 2.0
    critical: 3.0
  core_hours:
    warning: 2.5
    critical: 3.5
alerts:
  enabled: true
  cooldown_period: 1800
  channels:
    email:
      enabled: false
      recipients: []
      smtp_server: localhost
      smtp_port: 25
      from_address: monitoring@example.com
    slack:
      enabled: false
      webhook_url: ''
    log:
      enabled: true
      log_file: alerts/alert_history.log
    ntfy:
      enabled: true
      topic: ect-hpc
      server: https://ntfy.sh
  report_levels:
  - critical
  - warning
model:
  model_dir: models/
  type: statistical
  retrain_interval: 24
  training_window: 30
metrics:
  job_submission_rate: true
  core_utilization: true
  execution_time: true
  user_activity: true
  core_hours_consumption: true
logging:
  level: INFO
  file: anomaly_detector.log
  max_size_mb: 10
  backup_count: 5
